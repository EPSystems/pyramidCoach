<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1b17" />
    <title>Offline · Pyramid Coach</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1b17;
        --fg: #eceae2;
        --muted: #9a9a8f;
        --volt: #d9f24a;
        --ink: #1a1b17;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 26rem; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { margin: 16px 0 8px; font-size: 1.75rem; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; }
      p { margin: 0 0 12px; color: var(--muted); }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
      a, button {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        border: 2px solid var(--volt);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button { background: var(--volt); color: var(--ink); }
      a { background: transparent; color: var(--volt); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page hasn't been saved on this phone yet. Pages you opened with signal (Today, Week, your sessions) still work offline.</p>
      <p>Sets you log offline are kept on the phone and sync when you're back online.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a href="/today">Open Today</a>
      </div>
    </main>
    <script>
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
